# SSC rate config.
# Graph locked at 48k. For UHQ (96k codec), the BT media-sink does
# 48→96k internally at a clean 2:1 integer ratio. For 44.1k sources:
# 44.1→48k (quality=10, 1.088:1) + 48→96k (2:1) beats direct 44.1→96k (2.177:1).
context.properties = {
    default.clock.allowed-rates = [ 48000 ]
}
